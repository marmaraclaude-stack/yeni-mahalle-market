name: secret-teshis

# GECICI TESHIS: Bu depoda tanimli secret ADLARINI listeler.
# Degerler asla yazdirilmaz; yalniz anahtar isimleri (jq keys) basilir.
# Amac: aynanin bekledigi MIRROR_TOKEN var mi, yoksa baska bir adla mi
# tanimlanmis (or. CONNECTION) tespit etmek. Sorun cozulunce silinecek.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teshis:
    runs-on: ubuntu-latest
    steps:
      - name: Tanimli secret adlari
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          echo "--- bu depoda gorunen secret adlari ---"
          echo "$ALL_SECRETS" | jq -r 'keys[]' || echo "(hic secret yok)"
          echo "--- bitti ---"
