name: mirror-to-britt

# marmaraclaude-stack/main'e her push'ta, ayni HEAD'i canli sitenin yayinlandigi
# depoya (brittenglishwithali/Yeni-Mahalle-Market) da iter. Boylece "ikinci push"
# elle yapilmaz; Vercel otomatik yayinlar.
#
# Gerekli secret: MIRROR_TOKEN -> brittenglishwithali deposuna "Contents: write"
# yetkisi olan bir GitHub token'i (fine-grained PAT veya classic repo scope).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    # Ayna yalniz kaynak depoda calissin; kopyalanan dosya hedef depoda tetiklenmesin.
    if: github.repository == 'marmaraclaude-stack/yeni-mahalle-market'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror main to brittenglishwithali
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          # ONEMLI: token yoksa BASARISIZ ol. Onceki surum burada "exit 0"
          # yapiyordu; Actions yesil tik gosteriyor ama hicbir sey yayinlanmiyordu.
          # 4 calisma boyunca deploy oldugu sanildi, hicbiri push etmemisti.
          # Yesil tik = gercekten yayinlandi demek olmali.
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::MIRROR_TOKEN secret tanimli degil - AYNA YAPILMADI, site guncellenmedi."
            echo "Cozum: Settings > Secrets and variables > Actions > New repository secret"
            echo "  Ad   : MIRROR_TOKEN"
            echo "  Deger: brittenglishwithali/Yeni-Mahalle-Market uzerinde 'Contents: write' yetkili token"
            exit 1
          fi
          git push "https://x-access-token:${MIRROR_TOKEN}@github.com/brittenglishwithali/Yeni-Mahalle-Market.git" HEAD:main
          # Push'un gercekten landigini dogrula: hedefteki main SHA'si bizimkiyle ayni mi?
          remote_sha=$(git ls-remote "https://x-access-token:${MIRROR_TOKEN}@github.com/brittenglishwithali/Yeni-Mahalle-Market.git" refs/heads/main | cut -f1)
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Ayna dogrulanamadi. Hedef main=$remote_sha, beklenen=$GITHUB_SHA"
            exit 1
          fi
          echo "Ayna tamam ve dogrulandi: main -> brittenglishwithali/main @ $remote_sha"
