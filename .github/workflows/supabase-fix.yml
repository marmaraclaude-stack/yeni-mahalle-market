# TEK SEFERLİK teşhis + düzeltme köprüsü.
# 1) Canlı sitenin JS'inden gerçekte kullandığı Supabase proje ref'ini bulur
# 2) Token'ın hesabındaki projelerle karşılaştırır
# 3) Doğru projeye migration'ları uygular ve doğrular
# 4) Raporu .diagnostic/supabase-diag.txt olarak repoya yazar (log erişimi kapalı olduğu için)
name: supabase-fix

on:
  workflow_dispatch:
    inputs:
      sbp_token:
        description: "Supabase personal access token (sbp_...)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Teşhis + düzeltme
        env:
          SBP: ${{ inputs.sbp_token }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SBP"
          AUTH="Authorization: Bearer $SBP"
          mkdir -p .diagnostic
          R=.diagnostic/supabase-diag.txt
          : > $R

          echo "== 1) Sitenin kullandığı Supabase ref'i ==" | tee -a $R
          HTML=$(curl -sL https://sapancayenimahallemarket.com/ || true)
          SITE_REFS=$(echo "$HTML" | grep -oE '[a-z]{20}\.supabase\.co' | sort -u || true)
          if [ -z "$SITE_REFS" ]; then
            # HTML'de yoksa JS chunk'larını tara
            CHUNKS=$(echo "$HTML" | grep -oE '/_next/static/[^"]+\.js' | sort -u | head -20)
            for c in $CHUNKS; do
              SITE_REFS=$(curl -sL "https://sapancayenimahallemarket.com$c" | grep -oE '[a-z]{20}\.supabase\.co' | sort -u || true)
              [ -n "$SITE_REFS" ] && break
            done
          fi
          echo "Site ref(ler)i: ${SITE_REFS:-BULUNAMADI}" | tee -a $R
          SITE_REF=$(echo "$SITE_REFS" | head -1 | cut -d. -f1)

          echo "== 2) Token hesabındaki projeler ==" | tee -a $R
          PROJECTS=$(curl -sf -H "$AUTH" https://api.supabase.com/v1/projects || echo "[]")
          echo "$PROJECTS" | jq -r '.[] | "\(.id)  \(.name)"' | tee -a $R

          if [ -z "$SITE_REF" ]; then
            echo "SONUC: Site ref'i tespit edilemedi." | tee -a $R
            exit 0
          fi

          IN_ACCOUNT=$(echo "$PROJECTS" | jq -r --arg r "$SITE_REF" '[.[] | select(.id == $r)] | length')
          if [ "$IN_ACCOUNT" -ne 1 ]; then
            echo "SONUC: Sitenin projesi ($SITE_REF) bu token'ın hesabında YOK. Site başka bir Supabase hesabına bağlı." | tee -a $R
            exit 0
          fi

          echo "== 3) Doğru projeye ($SITE_REF) migration uygulanıyor ==" | tee -a $R
          run_sql () {
            jq -n --rawfile q "$1" '{query: $q}' > /tmp/body.json
            HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
              -H "$AUTH" -H "Content-Type: application/json" \
              --data @/tmp/body.json \
              "https://api.supabase.com/v1/projects/$SITE_REF/database/query")
            echo "  $1 -> HTTP $HTTP" | tee -a $R
            if [ "$HTTP" -ge 300 ]; then
              echo "  Yanıt: $(cat /tmp/resp.json | head -c 500)" | tee -a $R
              return 1
            fi
            return 0
          }
          run_sql supabase/migrations/20260703100000_eticaret_schema.sql || echo "  (schema hatası — tablolar zaten var olabilir, seed'e geçiliyor)" | tee -a $R
          run_sql supabase/migrations/20260703100001_eticaret_seed.sql || true

          echo "== 4) Doğrulama ==" | tee -a $R
          jq -n '{query: "select (select count(*) from public.shop_categories) as kategoriler, (select count(*) from public.products) as urunler;"}' > /tmp/body.json
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            --data @/tmp/body.json \
            "https://api.supabase.com/v1/projects/$SITE_REF/database/query" | tee -a $R
          echo "" | tee -a $R
          echo "SONUC: TAMAM" | tee -a $R

      - name: Raporu repoya yaz
        if: always()
        run: |
          git config user.name "supabase-fix-bot"
          git config user.email "noreply@github.com"
          git add .diagnostic/supabase-diag.txt
          git commit -m "diag: supabase kurulum raporu" || exit 0
          git push
