name: supabase-fix
on:
  workflow_dispatch:
    inputs:
      sbp_token: { required: true, type: string }
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uygula
        env:
          SBP: ${{ inputs.sbp_token }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SBP"
          AUTH="Authorization: Bearer $SBP"; REF="vkaknwulaatzgucclvzn"
          mkdir -p .diagnostic; R=.diagnostic/supabase-diag.txt; : > $R
          run_q () {
            jq -n --arg q "$1" '{query: $q}' > /tmp/b.json
            HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data @/tmp/b.json "https://api.supabase.com/v1/projects/$REF/database/query")
            echo "$2 -> HTTP $HTTP $([ $HTTP -ge 300 ] && head -c 200 /tmp/r.json)" | tee -a $R
          }
          # Ürün sayısını tam 1000'e indir: fazlalık ürünleri sil (öne çıkan/çok satan/indirimli olmayan, sipariş kalemi olmayanlardan)
          run_q "delete from public.products p where p.id in (select id from public.products where is_active and not is_featured and not is_best_seller and compare_at_price is null and id not in (select product_id from public.order_items where product_id is not null) order by created_at desc limit (greatest((select count(*) from public.products) - 1000, 0)));" "1000e indir"
          # İndirimliyi tam 30'a ayarla: mevcut fazla indirimlileri temizle
          run_q "update public.products set compare_at_price = null where id in (select id from public.products where compare_at_price is not null and compare_at_price > price order by random() offset 30);" "indirimli 30"
          # Eksikse 30'a tamamla
          run_q "with eksik as (select greatest(30 - (select count(*) from public.products where compare_at_price is not null and compare_at_price>price), 0) as n), hedef as (select id, price from public.products where (compare_at_price is null or compare_at_price<=price) and is_active order by random() limit (select n from eksik)) update public.products p set compare_at_price = round((h.price*1.2)::numeric,2) from hedef h where p.id=h.id;" "indirimli tamamla"
          run_q "select (select count(*) from public.products) as urun, (select count(*) from public.products where is_active) as aktif, (select count(*) from public.products where compare_at_price is not null and compare_at_price>price) as indirimli;" "ozet"
          cat /tmp/r.json | tee -a $R; echo "" | tee -a $R
      - name: Raporu yaz
        if: always()
        run: |
          git config user.name "supabase-fix-bot"; git config user.email "noreply@github.com"
          git pull --rebase || true
          git add .diagnostic/supabase-diag.txt
          git commit -m "diag: v18 raporu" || exit 0
          git push
