# TEK SEFERLİK: auth config düzeltmesi (site_url localhost -> prod, autoconfirm)
# + mevcut kullanıcıları onayla + banner içerikleri + HOSGELDIN200 kuponu.
name: supabase-fix

on:
  workflow_dispatch:
    inputs:
      sbp_token:
        required: true
        type: string

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uygula
        env:
          SBP: ${{ inputs.sbp_token }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SBP"
          AUTH="Authorization: Bearer $SBP"
          REF="vkaknwulaatzgucclvzn"
          mkdir -p .diagnostic
          R=.diagnostic/supabase-diag.txt
          : > $R

          echo "== 1) Auth config: site_url + autoconfirm ==" | tee -a $R
          HTTP=$(curl -s -o /tmp/a.json -w "%{http_code}" -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"site_url":"https://sapancayenimahallemarket.com","uri_allow_list":"https://sapancayenimahallemarket.com/**,https://*.vercel.app/**","mailer_autoconfirm":true}' \
            "https://api.supabase.com/v1/projects/$REF/config/auth")
          echo "auth patch -> HTTP $HTTP $([ $HTTP -ge 300 ] && head -c 300 /tmp/a.json)" | tee -a $R

          run_q () {
            jq -n --arg q "$1" '{query: $q}' > /tmp/b.json
            HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data @/tmp/b.json "https://api.supabase.com/v1/projects/$REF/database/query")
            echo "$2 -> HTTP $HTTP $([ $HTTP -ge 300 ] && head -c 200 /tmp/r.json)" | tee -a $R
          }

          echo "== 2) Bekleyen kullanıcıları onayla ==" | tee -a $R
          run_q "update auth.users set email_confirmed_at = now() where email_confirmed_at is null;" "kullanici onayi"

          echo "== 3) Banner içerikleri (kullanıcı örnekleri) ==" | tee -a $R
          run_q "delete from public.banners;" "eski bannerlar sil"
          run_q "insert into public.banners (title, subtitle, cta_text, cta_href, tint, sort) values ('İlk siparişine 200 TL indirim', 'HOSGELDIN200 koduyla, 750 TL üzeri ilk siparişinde geçerli', 'Alışverişe Başla', '/urunler', 1, 0), ('1500 TL üzeri teslimat ücretsiz', 'Sapanca içi siparişin aynı gün kapında', 'Ürünleri İncele', '/urunler', 4, 1), ('Her hafta 20 üründe indirim', 'Fırsat ürünlerini kaçırma, stoklar sınırlı', 'Fırsatları Gör', '/firsatlar', 6, 2);" "yeni bannerlar"

          echo "== 4) HOSGELDIN200 kuponu ==" | tee -a $R
          run_q "insert into public.coupons (code, description, discount_type, value, min_order_total) values ('HOSGELDIN200', 'İlk siparişe özel 200 TL indirim', 'fixed', 200, 750) on conflict (code) do nothing;" "kupon"

          echo "== 5) Ücretsiz teslimat eşiği 1500 ==" | tee -a $R
          run_q "update public.shop_settings set free_delivery_over = 1500 where id = 1;" "esik"

          echo "== 6) Doğrulama ==" | tee -a $R
          run_q "select (select count(*) from public.banners) as banner, (select count(*) from public.coupons where code='HOSGELDIN200') as kupon, (select count(*) from auth.users where email_confirmed_at is null) as onaysiz_kullanici;" "ozet"
          cat /tmp/r.json | tee -a $R
          echo "" | tee -a $R
      - name: Raporu yaz
        if: always()
        run: |
          git config user.name "supabase-fix-bot"
          git config user.email "noreply@github.com"
          git pull --rebase || true
          git add .diagnostic/supabase-diag.txt
          git commit -m "diag: auth+banner+kupon duzeltme raporu" || exit 0
          git push
