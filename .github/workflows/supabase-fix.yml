# TEK SEFERLİK: kurulum doğrulaması (salt okuma).
name: supabase-fix

on:
  workflow_dispatch:
    inputs:
      sbp_token:
        required: true
        type: string

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Doğrula
        env:
          SBP: ${{ inputs.sbp_token }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SBP"
          AUTH="Authorization: Bearer $SBP"
          REF="vkaknwulaatzgucclvzn"
          mkdir -p .diagnostic
          R=.diagnostic/supabase-diag.txt
          : > $R
          Q="select (select count(*) from public.cart_items) as sepet_satiri, (select count(*) from public.coupons) as kupon, (select count(*) from information_schema.columns where table_name = 'orders' and column_name in ('coupon_code','discount_total')) as orders_yeni_kolon, (select left(closed_message, 60) from public.shop_settings where id = 1) as kapali_mesaji;"
          jq -n --arg q "$Q" '{query: $q}' > /tmp/b.json
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            --data @/tmp/b.json "https://api.supabase.com/v1/projects/$REF/database/query" | tee -a $R
          echo "" | tee -a $R
      - name: Raporu yaz
        if: always()
        run: |
          git config user.name "supabase-fix-bot"
          git config user.email "noreply@github.com"
          git pull --rebase || true
          git add .diagnostic/supabase-diag.txt
          git commit -m "diag: kurulum doğrulama raporu" || exit 0
          git push
