# TEK SEFERLİK teşhis v2 — sitenin gerçek Supabase ref'ini /giris chunk'larından bulur,
# sitenin gördüğü hatayı PostgREST'e aynı anahtarla giderek yeniden üretir,
# doğru projeye chat şemasını da uygular, sayımları doğrular.
name: supabase-fix

on:
  workflow_dispatch:
    inputs:
      sbp_token:
        description: "Supabase personal access token (sbp_...)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Teşhis v2
        env:
          SBP: ${{ inputs.sbp_token }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SBP"
          AUTH="Authorization: Bearer $SBP"
          TARGET="vkaknwulaatzgucclvzn"
          mkdir -p .diagnostic
          R=.diagnostic/supabase-diag.txt
          : > $R

          echo "== 1) Site ref taraması (derin) ==" | tee -a $R
          REFS=""
          ANON=""
          for page in /giris /urunler /; do
            HTML=$(curl -sL "https://sapancayenimahallemarket.com$page" || true)
            for c in $(echo "$HTML" | grep -oE '/_next/static/[^" ]+\.js' | sort -u); do
              JS=$(curl -sL "https://sapancayenimahallemarket.com$c" || true)
              r=$(echo "$JS" | grep -oE '[a-z]{20}\.supabase\.co' | sort -u || true)
              if [ -n "$r" ]; then
                REFS="$REFS $r"
                if [ -z "$ANON" ]; then
                  ANON=$(echo "$JS" | grep -oE '(eyJ[A-Za-z0-9_-]{60,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|sb_publishable_[A-Za-z0-9_-]{20,})' | head -1 || true)
                fi
              fi
            done
            [ -n "$REFS" ] && break
          done
          REFS=$(echo $REFS | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "Bulunan ref(ler): ${REFS:-YOK}" | tee -a $R
          echo "Anon key bulundu mu: $([ -n "$ANON" ] && echo "evet (${ANON:0:16}...)" || echo hayır)" | tee -a $R

          SITE_REF=$(echo $REFS | tr ' ' '\n' | head -1 | cut -d. -f1)

          if [ -n "$SITE_REF" ] && [ -n "$ANON" ]; then
            echo "== 2) Sitenin gördüğü hatayı yeniden üret (PostgREST) ==" | tee -a $R
            HTTP=$(curl -s -o /tmp/pg.json -w "%{http_code}" \
              -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
              "https://$SITE_REF.supabase.co/rest/v1/products?select=id&limit=1")
            echo "REF=$SITE_REF -> HTTP $HTTP : $(head -c 300 /tmp/pg.json)" | tee -a $R
          fi

          echo "== 3) Hedef projeye ($TARGET) chat şeması (idempotent değil, hata olabilir) ==" | tee -a $R
          jq -n --rawfile q supabase/migrations/20260523120000_chat_schema.sql '{query: $q}' > /tmp/b.json
          HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" \
            --data @/tmp/b.json "https://api.supabase.com/v1/projects/$TARGET/database/query")
          echo "chat_schema -> HTTP $HTTP $([ $HTTP -ge 300 ] && head -c 200 /tmp/r.json)" | tee -a $R

          echo "== 4) Hedef proje doğrulama ==" | tee -a $R
          jq -n '{query:"select (select count(*) from public.shop_categories) as kategoriler, (select count(*) from public.products) as urunler;"}' > /tmp/b.json
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            --data @/tmp/b.json "https://api.supabase.com/v1/projects/$TARGET/database/query" | tee -a $R
          echo "" | tee -a $R

          echo "== 5) Hedef projenin URL'i (Vercel için) ==" | tee -a $R
          echo "https://$TARGET.supabase.co" | tee -a $R
          echo "SONUC: TAMAM" | tee -a $R

      - name: Raporu repoya yaz
        if: always()
        run: |
          git config user.name "supabase-fix-bot"
          git config user.email "noreply@github.com"
          git pull --rebase || true
          git add .diagnostic/supabase-diag.txt
          git commit -m "diag: supabase teşhis v2 raporu" || exit 0
          git push
