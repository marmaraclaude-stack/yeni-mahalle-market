# TEK SEFERLİK köprü: products.details kolonu + şarküteri seed'i uygular.
# Çalıştıktan sonra bu dosya repodan KALDIRILIR.
name: supabase-fix
on:
  workflow_dispatch:
    inputs:
      sbp:
        description: "Supabase access token"
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply product details migration + sarkuteri seed
        env:
          SBP: ${{ inputs.sbp }}
        run: |
          set -euo pipefail
          {
            cat supabase/migrations/20260714090000_product_details.sql
            echo
            cat supabase/seeds/20260714_sarkuteri_migros.sql
          } > /tmp/q.sql
          jq -Rs '{query: .}' /tmp/q.sql > /tmp/q.json
          curl -sS -f -X POST \
            "https://api.supabase.com/v1/projects/vkaknwulaatzgucclvzn/database/query" \
            -H "Authorization: Bearer $SBP" \
            -H "Content-Type: application/json" \
            -d @/tmp/q.json | tee /tmp/out.json
          echo
          grep -q "sarkuteri_count" /tmp/out.json || { echo "VERIFY FAILED"; exit 1; }
