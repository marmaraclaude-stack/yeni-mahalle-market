name: supabase-fix
on:
  workflow_dispatch:
    inputs:
      sbp_token: { required: true, type: string }
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uygula
        env:
          SBP: ${{ inputs.sbp_token }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SBP"
          AUTH="Authorization: Bearer $SBP"; REF="vkaknwulaatzgucclvzn"
          mkdir -p .diagnostic; R=.diagnostic/supabase-diag.txt; : > $R
          run_sql () {
            jq -n --rawfile q "$1" '{query: $q}' > /tmp/b.json
            HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data @/tmp/b.json "https://api.supabase.com/v1/projects/$REF/database/query")
            echo "$1 -> HTTP $HTTP $([ $HTTP -ge 300 ] && head -c 250 /tmp/r.json)" | tee -a $R
          }
          run_q () {
            jq -n --arg q "$1" '{query: $q}' > /tmp/b.json
            HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data @/tmp/b.json "https://api.supabase.com/v1/projects/$REF/database/query")
            echo "$2 -> HTTP $HTTP $([ $HTTP -ge 300 ] && head -c 200 /tmp/r.json)" | tee -a $R
          }
          # 1) 1000 ürün
          run_sql supabase/migrations/20260703b00000_products_1000.sql
          # 2) 4 kupon (HOSGELDIN200 zaten var; 3 ekle)
          run_q "insert into public.coupons (code, description, discount_type, value, min_order_total, per_user_limit) values ('MARKET50','Sepette 50 TL indirim','fixed',50,300,3), ('YUZDE10','Tüm sepette %10 indirim','percent',10,250,0), ('HAFTASONU75','Hafta sonu 75 TL indirim','fixed',75,500,1) on conflict (code) do nothing;" "3 kupon ekle"
          # 3) 20 indirimli ürün (compare_at_price > price)
          run_q "with hedef as (select id, price from public.products where compare_at_price is null and is_active order by random() limit 20) update public.products p set compare_at_price = round((h.price * 1.20)::numeric, 2) from hedef h where p.id = h.id;" "20 indirimli"
          # 4) best-seller örnekleri (öne çıkanlardan 15)
          run_q "with hedef as (select id from public.products where is_active and is_featured order by random() limit 15) update public.products p set is_best_seller = true from hedef h where p.id = h.id;" "15 cok satan"
          # 5) doğrulama
          run_q "select (select count(*) from public.products) as urun, (select count(*) from public.coupons where is_active) as kupon, (select count(*) from public.products where compare_at_price is not null and compare_at_price>price) as indirimli, (select count(*) from public.products where is_best_seller) as cok_satan;" "ozet"
          cat /tmp/r.json | tee -a $R; echo "" | tee -a $R
      - name: Raporu yaz
        if: always()
        run: |
          git config user.name "supabase-fix-bot"; git config user.email "noreply@github.com"
          git pull --rebase || true
          git add .diagnostic/supabase-diag.txt
          git commit -m "diag: v17 raporu" || exit 0
          git push
