name: supabase-fix
on:
  workflow_dispatch:
    inputs:
      sbp_token: { required: true, type: string }
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uygula
        env:
          SBP: ${{ inputs.sbp_token }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SBP"
          AUTH="Authorization: Bearer $SBP"; REF="vkaknwulaatzgucclvzn"
          mkdir -p .diagnostic; R=.diagnostic/supabase-diag.txt; : > $R
          run_sql () {
            jq -n --rawfile q "$1" '{query: $q}' > /tmp/b.json
            HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data @/tmp/b.json "https://api.supabase.com/v1/projects/$REF/database/query")
            echo "$1 -> HTTP $HTTP $([ $HTTP -ge 300 ] && head -c 250 /tmp/r.json)" | tee -a $R
          }
          run_sql supabase/migrations/20260703800000_order_courier.sql
          run_sql supabase/migrations/20260703600000_banners_v2.sql
          run_sql supabase/migrations/20260703700000_products_500.sql
          Q="select (select count(*) from public.products) as urun, (select count(*) from public.banners) as banner, (select count(*) from information_schema.columns where table_name='orders' and column_name in ('courier_name','courier_phone')) as kurye_kolon;"
          jq -n --arg q "$Q" '{query: $q}' > /tmp/b.json
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            --data @/tmp/b.json "https://api.supabase.com/v1/projects/$REF/database/query" | tee -a $R
          echo "" | tee -a $R
      - name: Raporu yaz
        if: always()
        run: |
          git config user.name "supabase-fix-bot"; git config user.email "noreply@github.com"
          git pull --rebase || true
          git add .diagnostic/supabase-diag.txt
          git commit -m "diag: v13 migration raporu" || exit 0
          git push
