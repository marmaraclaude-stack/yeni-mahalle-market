# TEK SEFERLİK köprü: sipariş akışını açar (iyzico incelemesi için).
# Çalıştıktan sonra bu dosya repodan KALDIRILIR.
name: supabase-fix
on:
  workflow_dispatch:
    inputs:
      sbp:
        description: "Supabase access token"
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Open ordering + disable closed banner
        env:
          SBP: ${{ inputs.sbp }}
        run: |
          set -euo pipefail
          cat > /tmp/q.sql <<'SQL'
          UPDATE shop_settings SET ordering_open = true, cod_cash_enabled = true, cod_card_enabled = true;
          UPDATE banners SET is_active = false
            WHERE is_active = true
              AND (coalesce(subtitle,'') ILIKE '%alamıyoruz%'
                OR coalesce(subtitle,'') ILIKE '%596 37 55%'
                OR coalesce(title,'') ILIKE '%online sipariş%');
          SELECT (SELECT ordering_open FROM shop_settings LIMIT 1)   AS ordering_open,
                 (SELECT cod_cash_enabled FROM shop_settings LIMIT 1) AS cod_cash,
                 (SELECT cod_card_enabled FROM shop_settings LIMIT 1) AS cod_card,
                 (SELECT iyzico_enabled FROM shop_settings LIMIT 1)   AS iyzico,
                 (SELECT count(*) FROM banners WHERE is_active)       AS active_banners;
          SQL
          jq -Rs '{query: .}' /tmp/q.sql > /tmp/q.json
          curl -sS -f -X POST \
            "https://api.supabase.com/v1/projects/vkaknwulaatzgucclvzn/database/query" \
            -H "Authorization: Bearer $SBP" \
            -H "Content-Type: application/json" \
            -d @/tmp/q.json | tee /tmp/out.json
          echo
          grep -q '"ordering_open":true' /tmp/out.json || { echo "VERIFY FAILED"; exit 1; }
