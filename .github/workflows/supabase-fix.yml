# TEK SEFERLİK köprü: et/tavuk seed v2'yi uygular. Sonra KALDIRILIR.
name: supabase-fix
on:
  workflow_dispatch:
    inputs:
      sbp:
        description: "Supabase access token"
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply et/tavuk seed v2
        env:
          SBP: ${{ inputs.sbp }}
        run: |
          set -euo pipefail
          jq -Rs '{query: .}' supabase/seeds/20260714_et_tavuk_v2.sql > /tmp/q.json
          curl -sS -f -X POST \
            "https://api.supabase.com/v1/projects/vkaknwulaatzgucclvzn/database/query" \
            -H "Authorization: Bearer $SBP" \
            -H "Content-Type: application/json" \
            -d @/tmp/q.json | tee /tmp/out.json
          echo
          grep -q "sarkuteri_count" /tmp/out.json || { echo "VERIFY FAILED"; exit 1; }
