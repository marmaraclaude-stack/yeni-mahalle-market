# TEK SEFERLİK: banner alt metnini 30 dk diline güncelle.
name: supabase-fix

on:
  workflow_dispatch:
    inputs:
      sbp_token:
        required: true
        type: string

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Güncelle
        env:
          SBP: ${{ inputs.sbp_token }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SBP"
          AUTH="Authorization: Bearer $SBP"
          REF="vkaknwulaatzgucclvzn"
          mkdir -p .diagnostic
          R=.diagnostic/supabase-diag.txt
          : > $R
          Q="update public.banners set subtitle = 'Sapanca içi siparişin 30 dakika içinde kapında' where subtitle like '%aynı gün%'; select title, subtitle from public.banners order by sort;"
          jq -n --arg q "$Q" '{query: $q}' > /tmp/b.json
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            --data @/tmp/b.json "https://api.supabase.com/v1/projects/$REF/database/query" | tee -a $R
          echo "" | tee -a $R
      - name: Raporu yaz
        if: always()
        run: |
          git config user.name "supabase-fix-bot"
          git config user.email "noreply@github.com"
          git pull --rebase || true
          git add .diagnostic/supabase-diag.txt
          git commit -m "diag: banner metni guncelleme raporu" || exit 0
          git push
