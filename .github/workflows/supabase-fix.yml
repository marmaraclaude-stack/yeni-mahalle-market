name: supabase-fix
on:
  workflow_dispatch:
    inputs:
      sbp_token: { required: true, type: string }
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uygula
        env:
          SBP: ${{ inputs.sbp_token }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SBP"
          AUTH="Authorization: Bearer $SBP"; REF="vkaknwulaatzgucclvzn"
          mkdir -p .diagnostic; R=.diagnostic/supabase-diag.txt; : > $R
          run_q () {
            jq -n --arg q "$1" '{query: $q}' > /tmp/b.json
            HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data @/tmp/b.json "https://api.supabase.com/v1/projects/$REF/database/query")
            echo "$2 -> HTTP $HTTP $([ $HTTP -ge 300 ] && head -c 300 /tmp/r.json)" | tee -a $R
          }
          run_file () {
            jq -Rs '{query: .}' "$1" > /tmp/bf.json
            HTTP=$(curl -s -o /tmp/rf.json -w "%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data @/tmp/bf.json "https://api.supabase.com/v1/projects/$REF/database/query")
            echo "$1 -> HTTP $HTTP $([ $HTTP -ge 300 ] && head -c 300 /tmp/rf.json)" | tee -a $R
          }
          # 1) Sigara & Tutun urunlerini kaldir (kategori siteden cikti)
          run_q "delete from public.products where category_slug = 'sigara-tutun' and id not in (select product_id from public.order_items where product_id is not null);" "sigara sil"
          run_q "update public.products set is_active = false where category_slug = 'sigara-tutun';" "kalan sigara pasif"
          # 2) Ev & Yasam seed
          run_file supabase/migrations/20260707300000_ev_yasam_seed.sql
          # 3) Toplami tam 2000'e getir (fazlaysa sade filler sil; ev-yasam korunur)
          run_q "delete from public.products where id in (select id from public.products where is_active and not is_featured and not is_best_seller and compare_at_price is null and category_slug <> 'ev-yasam' and id not in (select product_id from public.order_items where product_id is not null) order by created_at desc limit greatest((select count(*) from public.products where is_active) - 2000, 0));" "2000e indir"
          run_q "select (select count(*) from public.products where is_active) as aktif, (select count(*) from public.products where category_slug='ev-yasam') as ev_yasam, (select count(*) from public.products where category_slug='sigara-tutun' and is_active) as sigara_aktif;" "ozet"
          cat /tmp/r.json | tee -a $R; echo "" | tee -a $R
      - name: Raporu yaz
        if: always()
        run: |
          git config user.name "supabase-fix-bot"; git config user.email "noreply@github.com"
          git pull --rebase || true
          git add .diagnostic/supabase-diag.txt
          git commit -m "diag: ev-yasam gecis raporu" || exit 0
          git push
