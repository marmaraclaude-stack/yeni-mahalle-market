name: supabase-fix
on:
  workflow_dispatch:
    inputs:
      sbp_token: { required: true, type: string }
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uygula
        env:
          SBP: ${{ inputs.sbp_token }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SBP"
          AUTH="Authorization: Bearer $SBP"; REF="vkaknwulaatzgucclvzn"
          mkdir -p .diagnostic; R=.diagnostic/supabase-diag.txt; : > $R
          jq -n --rawfile q supabase/migrations/20260703a00000_courier_image.sql '{query: $q}' > /tmp/b.json
          HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" \
            --data @/tmp/b.json "https://api.supabase.com/v1/projects/$REF/database/query")
          echo "courier_image migration -> HTTP $HTTP $([ $HTTP -ge 300 ] && head -c 250 /tmp/r.json)" | tee -a $R
          jq -n --arg q "update public.banners set cta_text='', cta_href='';" '{query: $q}' > /tmp/b.json
          HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" \
            --data @/tmp/b.json "https://api.supabase.com/v1/projects/$REF/database/query")
          echo "banner cta temizle -> HTTP $HTTP" | tee -a $R
          jq -n --arg q "select (select count(*) from information_schema.columns where table_name='couriers' and column_name='image_url') as kurye_gorsel, (select count(*) from public.banners where cta_text<>'') as cta_kalan;" '{query: $q}' > /tmp/b.json
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
            --data @/tmp/b.json "https://api.supabase.com/v1/projects/$REF/database/query" | tee -a $R
          echo "" | tee -a $R
      - name: Raporu yaz
        if: always()
        run: |
          git config user.name "supabase-fix-bot"; git config user.email "noreply@github.com"
          git pull --rebase || true
          git add .diagnostic/supabase-diag.txt
          git commit -m "diag: v16 raporu" || exit 0
          git push
